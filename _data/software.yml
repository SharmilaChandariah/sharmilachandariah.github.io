# Software projects, shown on the Software page in the order listed.
# Each entry needs: name, description
# Optional: authors, website, repo, docs, paper

- name: SchemaAware-NL2SQL
  authors: Sharmila Devi Chandariah
  repo: https://github.com/SharmilaChandariah/SchemaAware-NL2SQL
  description: >-
    Reference implementation of schema-only natural-language-to-SQL ("reasoning without seeing").
    The language model receives only database schema metadata, never data rows; generated SQL
    runs inside the database and results go directly to the user.

- name: DocSearchPOCCode
  authors: Sharmila Devi Chandariah
  repo: https://github.com/SharmilaChandariah/DocSearchPOCCode
  description: >-
    Proof-of-concept retrieval-augmented document search for enterprise policy and procedure content.
